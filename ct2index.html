<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Machine Component Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #246EFF;
      --accent-light: rgba(36, 110, 255, 0.1);
      --accent-glow: rgba(36, 110, 255, 0.3);
      --bg: #ffffff;
      --surface: #f5f7fa;
      --surface2: #edf0f5;
      --border: rgba(36, 110, 255, 0.2);
      --text: #1a1f2e;
      --text-muted: #6b7280;
      --visited: #2ea043;
      --radius: 12px;
    }

    body {
      font-family: 'Open Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 12px 20px;
    }

    /* ── Header ── */
    .header { text-align: center; margin-bottom: 10px; }
    .header h1 {
      font-size: clamp(20px, 3.5vw, 32px);
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.5px;
      line-height: 1.1;
    }
    .header h1 span { color: var(--text); }
    .header-sub { margin-top: 10px; font-size: 13px; color: var(--text-muted); font-weight: 400; }

    /* ── Progress Bar ── */
    .progress-wrap { width: 100%; max-width: 528px; margin-bottom: 8px; }
    .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .progress-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
    .progress-count { font-size: 10px; font-weight: 700; color: var(--accent); }
    .progress-track { height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #66a3ff); border-radius: 99px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); width: 0%; }

    /* ── Viewer ── */
    .viewer-container { width: 100%; max-width: 528px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; position: relative; }

    .image-stage {
      position: relative; width: 100%; overflow: hidden; cursor: grab; background: #ffffff;
      min-height: 120px; max-height: 600px; display: flex; align-items: center; justify-content: center;
    }
    .image-stage.grabbing { cursor: grabbing; }

    .zoom-inner { position: relative; transform-origin: 0 0; transition: transform 0.08s ease; }
    .zoom-inner img { display: block; height: auto; width: auto; max-height: 580px; max-width: 100%; object-fit: contain; pointer-events: none; user-select: none; }

    /* ── Hotspots ── */
    .hotspot {
      position: absolute; width: 24px; height: 24px; border-radius: 50%; background: var(--accent);
      border: 3px solid #fff; color: #fff; font-family: 'Open Sans', sans-serif; font-size: 10px; font-weight: 800;
      display: flex; align-items: center; justify-content: center; cursor: pointer; transform: translate(-50%, -50%);
      z-index: 10; box-shadow: 0 0 0 4px var(--accent-glow), 0 4px 16px rgba(0,0,0,0.4); transition: all 0.2s ease; animation: pulse 2.5s infinite;
    }
    .hotspot:hover { transform: translate(-50%, -50%) scale(1.15); box-shadow: 0 0 0 6px var(--accent-glow), 0 6px 24px rgba(36,110,255,0.5); }
    .hotspot:focus-visible { outline: 3px solid #fff; outline-offset: 1px; }
    .hotspot.visited { background: var(--visited); box-shadow: 0 0 0 4px rgba(46,160,67,0.3); animation: none; }
    .hotspot.visited:hover { transform: translate(-50%, -50%) scale(1.1); }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 4px var(--accent-glow), 0 4px 16px rgba(0,0,0,0.4); }
      50% { box-shadow: 0 0 0 8px rgba(36,110,255,0.15), 0 4px 20px rgba(36,110,255,0.4); }
    }
    @media (prefers-reduced-motion: reduce) { .hotspot { animation: none; } .progress-fill { transition: none; } }

    /* ── Popup ── */
    .hotspot-popup {
      display: none; position: absolute; z-index: 100; background: #ffffff; border: 1.5px solid var(--accent);
      border-radius: 10px; padding: 10px 12px; width: 224px; max-width: calc(100% - 20px); max-height: 340px; overflow: auto;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 0 1px var(--accent-glow);
    }
    .hotspot-popup.visible { display: block; animation: popIn 0.18s ease; }
    @keyframes popIn { from { opacity: 0; transform: scale(0.92) translateY(4px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .popup-title { font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; padding-right: 18px; display: flex; align-items: center; gap: 6px; }
    .popup-num { background: var(--accent); color: #fff; width: 22px; height: 22px; border-radius: 50%; font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .popup-body { font-size: 13px; line-height: 1.55; color: var(--text); }
    .popup-body p { margin-bottom: 6px; } .popup-body p:last-child { margin-bottom: 0; }
    .popup-body .note { background: var(--surface); border-left: 3px solid var(--accent); padding: 6px 9px; border-radius: 0 6px 6px 0; color: var(--text-muted); font-size: 12px; margin-top: 6px; }
    .popup-body .warn { display: flex; gap: 8px; align-items: flex-start; background: #fdecec; border: 1px solid #f2c4c4; border-left: 4px solid #d64545; color: #8f2a2a; font-weight: 700; font-size: 12.5px; line-height: 1.4; padding: 9px 11px; border-radius: 8px; margin-top: 10px; }
    .popup-body .warn svg { flex-shrink: 0; width: 17px; height: 17px; stroke: #d64545; fill: none; stroke-width: 2.2; margin-top: 1px; }
    .popup-close { position: absolute; top: 8px; right: 10px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 4px; border-radius: 4px; transition: color 0.15s; }
    .popup-close:hover { color: var(--text); }

    /* close-up thumbnails inside popup */
    .popup-thumbs-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); margin: 9px 0 5px; }
    .popup-thumbs { display: flex; flex-wrap: wrap; gap: 6px; }
    .pthumb { position: relative; width: 72px; height: 72px; border-radius: 8px; overflow: hidden; cursor: pointer; border: 1px solid var(--border); padding: 0; background: none; }
    .pthumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.2s ease; }
    .pthumb:hover img { transform: scale(1.08); }
    .pthumb:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .pthumb .zoom-badge { position: absolute; right: 4px; bottom: 4px; width: 19px; height: 19px; border-radius: 5px; background: rgba(36,110,255,0.9); display: grid; place-items: center; }
    .pthumb .zoom-badge svg { width: 12px; height: 12px; stroke: #fff; fill: none; stroke-width: 2.2; }

    /* ── Zoom Controls ── */
    .zoom-controls { position: absolute; bottom: 14px; right: 14px; display: flex; flex-direction: column; gap: 4px; z-index: 20; }
    .zoom-btn { width: 26px; height: 26px; background: rgba(255,255,255,0.95); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; backdrop-filter: blur(6px); }
    .zoom-btn:hover { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }

    /* ── Toolbar ── */
    .viewer-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 7px 12px; border-top: 1px solid var(--border); background: var(--surface2); gap: 10px; flex-wrap: wrap; }
    .toolbar-hint { font-size: 10px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .kbd { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; font-size: 10px; padding: 2px 6px; font-weight: 700; letter-spacing: 0.5px; }
    .toolbar-actions { display: flex; gap: 8px; }
    .reset-btn { font-family: 'Open Sans', sans-serif; font-size: 10px; font-weight: 700; color: var(--text-muted); background: none; border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer; letter-spacing: 0.3px; transition: all 0.2s; display: flex; align-items: center; gap: 5px; }
    .reset-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-light); }

    /* ── Completion Banner ── */
    .complete-banner { display: none; margin-top: 16px; width: 100%; max-width: 528px; background: linear-gradient(135deg, rgba(46,160,67,0.15), rgba(36,110,255,0.1)); border: 1px solid rgba(46,160,67,0.4); border-radius: var(--radius); padding: 10px 16px; text-align: center; animation: slideIn 0.4s ease; }
    .complete-banner.show { display: block; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .complete-banner h3 { font-size: 13px; font-weight: 800; color: #3fb950; margin-bottom: 4px; }
    .complete-banner p { font-size: 11px; color: var(--text-muted); }

    /* ── Lightbox (click-into close-ups) ── */
    .lb { position: fixed; inset: 0; z-index: 500; background: rgba(15,23,30,0.92); display: none; align-items: center; justify-content: center; padding: 24px; }
    .lb.on { display: flex; }
    .lb figure { margin: 0; max-width: min(920px, 92vw); max-height: 88vh; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .lb img { max-width: 100%; max-height: 78vh; border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); background: #fff; }
    .lb figcaption { color: #dfe8ee; font-size: 13px; text-align: center; max-width: 60ch; font-family: 'Open Sans', sans-serif; }
    .lb-close { position: absolute; top: 16px; right: 18px; width: 42px; height: 42px; border-radius: 10px; border: none; cursor: pointer; background: rgba(255,255,255,0.15); color: #fff; font-size: 22px; line-height: 1; }
    .lb-close:hover { background: rgba(255,255,255,0.28); }
    .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer; background: rgba(255,255,255,0.15); color: #fff; font-size: 22px; display: grid; place-items: center; }
    .lb-nav:hover { background: rgba(255,255,255,0.28); }
    .lb-nav.prev { left: 16px; } .lb-nav.next { right: 16px; } .lb-nav[hidden] { display: none; }

    /* ── Edit mode (Ctrl+Shift+E) ── */
    .editbar { display: none; width: 100%; max-width: 528px; background: #fff8e6; border: 1px solid #f0e2b8; color: #6b5a17; padding: 8px 12px; font-size: 11px; border-radius: 8px; margin-bottom: 8px; align-items: center; gap: 10px; flex-wrap: wrap; }
    body.edit .editbar { display: flex; }
    body.edit .hotspot { cursor: grab; animation: none; }
    .editbar button { font: inherit; cursor: pointer; border: 1px solid #d9c98a; background: #fff; border-radius: 6px; padding: 4px 10px; font-weight: 700; }
    #coords { display: none; width: 100%; max-width: 528px; margin-bottom: 8px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
    body.edit #coords { display: block; }
  </style>
</head>

  const stage=document.getElementById('stage'), inner=document.getElementById('inner'),
        pfill=document.getElementById('progress-fill'), ptext=document.getElementById('progress-text'),
        banner=document.getElementById('complete-banner');
  const total=HOTSPOTS.length, visited=new Set();
  const view={scale:1,minScale:0.6,maxScale:4,tx:0,ty:0,dragging:false,lastX:0,lastY:0,pinch:null};
  const markers=[]; let activePopup=null, activeNum=-1;

  HOTSPOTS.forEach((h,i)=>{
    const b=document.createElement('button');
    b.className='hotspot'; b.type='button'; b.id='hs-'+i;
    b.style.left=h.x+'%'; b.style.top=h.y+'%'; b.textContent=i+1;
    b.setAttribute('aria-label',`Component ${i+1}: ${h.title}`);
    b.addEventListener('click',(e)=>{ if(document.body.classList.contains('edit'))return; e.stopPropagation(); (activeNum===i?closePopup():openPopup(i)); });
    inner.appendChild(b); markers.push(b);
  });

  /* ---- popup ---- */
  function openPopup(i){
    closePopup();
    const h=HOTSPOTS[i];
    visited.add(i); markers[i].classList.add('visited'); activeNum=i; updateProgress();

    const pop=document.createElement('div'); pop.className='hotspot-popup visible'; pop.setAttribute('role','dialog'); pop.setAttribute('aria-label',h.title);
    const imgs=(h.images||[]).filter(x=>x&&x.src);
    pop.innerHTML =
      `<button class="popup-close" type="button" aria-label="Close">✕</button>`+
      `<div class="popup-title"><span class="popup-num">${i+1}</span>${h.title}</div>`+
      `<div class="popup-body">${h.body}</div>`+
      (imgs.length?`<div class="popup-thumbs-label">Close-up${imgs.length>1?'s':''}</div><div class="popup-thumbs"></div>`:``);
    stage.appendChild(pop); activePopup=pop;

    if(imgs.length){
      const wrap=pop.querySelector('.popup-thumbs');
      imgs.forEach((im,idx)=>{
        const t=document.createElement('button'); t.type='button'; t.className='pthumb';
        t.setAttribute('aria-label',`Open close-up: ${im.caption||h.title}`);
        t.innerHTML=`<img src="${im.src}" alt="${(im.caption||h.title).replace(/"/g,'&quot;')}"><span class="zoom-badge"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg></span>`;
        t.addEventListener('click',(e)=>{ e.stopPropagation(); openLightbox(imgs,idx); });
        wrap.appendChild(t);
      });
    }
    pop.querySelector('.popup-close').addEventListener('click',(e)=>{e.stopPropagation();closePopup();});
    pop.addEventListener('click',e=>e.stopPropagation());

    positionPopup(i);
    pop.querySelector('.popup-close').focus();
  }

  function positionPopup(i){
    const sr=stage.getBoundingClientRect(), hr=markers[i].getBoundingClientRect(), pop=activePopup;
    let left = hr.left - sr.left + hr.width/2 + 12;
    let top  = hr.top  - sr.top  - 8;
    pop.style.left=left+'px'; pop.style.top=top+'px';
    requestAnimationFrame(()=>{
      const pr=pop.getBoundingClientRect(); const pad=8;
      if(pr.right > sr.right - pad) left = hr.left - sr.left + hr.width/2 - pr.width - 12; // flip left
      if(left < pad) left = pad;
      if(left + pr.width > sr.width - pad) left = sr.width - pr.width - pad;
      if(top + pr.height > sr.height - pad) top = sr.height - pr.height - pad; // flip up
      if(top < pad) top = pad;
      pop.style.left=left+'px'; pop.style.top=top+'px';
    });
  }
  function closePopup(){
    if(activePopup){ activePopup.remove(); activePopup=null; }
    if(activeNum>=0){ const m=markers[activeNum]; activeNum=-1; if(m) m.focus(); }
  }
  stage.addEventListener('click',()=>closePopup());

  /* ---- progress ---- */
  function updateProgress(){
    const c=visited.size; pfill.style.width=(c/total*100)+'%'; ptext.textContent=c+' / '+total+' explored';
    banner.classList.toggle('show', c===total);
  }
  document.getElementById('resetBtn').addEventListener('click',()=>{
    visited.clear(); markers.forEach(m=>m.classList.remove('visited')); closePopup(); updateProgress();
  });

  /* ---- zoom / pan ---- */
  function applyTransform(){ inner.style.transform=`translate(${view.tx}px, ${view.ty}px) scale(${view.scale})`; }
  function zoom(delta,cx,cy){
    const sr=stage.getBoundingClientRect();
    const px = cx!==undefined ? cx-sr.left : sr.width/2;
    const py = cy!==undefined ? cy-sr.top  : sr.height/2;
    const prev=view.scale;
    view.scale=Math.min(view.maxScale,Math.max(view.minScale,view.scale+delta));
    const f=view.scale/prev; view.tx=px-f*(px-view.tx); view.ty=py-f*(py-view.ty);
    applyTransform(); closePopup();
  }
  function resetZoom(){ view.scale=1; view.tx=0; view.ty=0; applyTransform(); closePopup(); }
  document.getElementById('zin').addEventListener('click',()=>zoom(0.25));
  document.getElementById('zout').addEventListener('click',()=>zoom(-0.25));
  document.getElementById('zreset').addEventListener('click',resetZoom);
  stage.addEventListener('wheel',e=>{ e.preventDefault(); zoom(e.deltaY<0?0.13:-0.13,e.clientX,e.clientY); },{passive:false});

  stage.addEventListener('mousedown',e=>{
    if(e.target.closest('.hotspot')||e.target.closest('.hotspot-popup')||e.target.closest('.zoom-controls')) return;
    if(document.body.classList.contains('edit')) return;
    view.dragging=true; view.lastX=e.clientX; view.lastY=e.clientY; stage.classList.add('grabbing');
  });
  window.addEventListener('mousemove',e=>{ if(!view.dragging)return; view.tx+=(e.clientX-view.lastX)*0.9; view.ty+=(e.clientY-view.lastY)*0.9; view.lastX=e.clientX; view.lastY=e.clientY; applyTransform(); });
  window.addEventListener('mouseup',()=>{ view.dragging=false; stage.classList.remove('grabbing'); });

  function dist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);}
  function mid(t){return {x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2};}
  stage.addEventListener('touchstart',e=>{
    if(e.target.closest('.hotspot')||e.target.closest('.hotspot-popup')) return;
    if(e.touches.length===1){ view.dragging=true; view.lastX=e.touches[0].clientX; view.lastY=e.touches[0].clientY; }
    else if(e.touches.length===2){ view.dragging=false; view.pinch=dist(e.touches); }
  },{passive:true});
  stage.addEventListener('touchmove',e=>{
    if(e.touches.length===1&&view.dragging){ e.preventDefault(); view.tx+=(e.touches[0].clientX-view.lastX)*0.9; view.ty+=(e.touches[0].clientY-view.lastY)*0.9; view.lastX=e.touches[0].clientX; view.lastY=e.touches[0].clientY; applyTransform(); }
    else if(e.touches.length===2&&view.pinch!==null){ e.preventDefault(); const d=dist(e.touches),m=mid(e.touches); zoom((d-view.pinch)*0.006,m.x,m.y); view.pinch=d; }
  },{passive:false});
  stage.addEventListener('touchend',()=>{ view.dragging=false; view.pinch=null; });

  /* ---- lightbox ---- */
  const lb=document.getElementById('lb'), lbImg=document.getElementById('lbImg'), lbCap=document.getElementById('lbCap'),
        lbPrev=document.getElementById('lbPrev'), lbNext=document.getElementById('lbNext'), lbClose=document.getElementById('lbClose');
  let lbSet=[], lbIdx=0, lbReturn=null;
  function openLightbox(set,idx){ lbSet=set; lbIdx=idx; lbReturn=document.activeElement; renderLb(); lb.classList.add('on'); lbClose.focus(); }
  function renderLb(){ const im=lbSet[lbIdx]; lbImg.src=im.src; lbImg.alt=im.caption||''; lbCap.textContent=im.caption||''; const m=lbSet.length>1; lbPrev.hidden=!m; lbNext.hidden=!m; }
  function closeLb(){ lb.classList.remove('on'); lbImg.src=''; if(lbReturn)lbReturn.focus(); }
  lbClose.addEventListener('click',closeLb);
  lb.addEventListener('click',e=>{ if(e.target===lb) closeLb(); });
  lbPrev.addEventListener('click',()=>{ lbIdx=(lbIdx-1+lbSet.length)%lbSet.length; renderLb(); });
  lbNext.addEventListener('click',()=>{ lbIdx=(lbIdx+1)%lbSet.length; renderLb(); });
  window.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ if(lb.classList.contains('on'))closeLb(); else if(activePopup)closePopup(); }
    if(lb.classList.contains('on')&&lbSet.length>1){ if(e.key==='ArrowLeft')lbPrev.click(); if(e.key==='ArrowRight')lbNext.click(); }
  });

  /* ---- edit mode ---- */
  let editReady=false;
  function initEdit(){
    if(editReady)return; editReady=true;
    const out=document.getElementById('coords'); let drag=null;
    const rectOf=()=>inner.getBoundingClientRect();
    function dump(){ out.value='Positions only. Update x/y in each HOTSPOTS entry (keep body & images):\n'+HOTSPOTS.map((h,i)=>`  ${i+1}. ${h.title}  \u2192  x:${h.x.toFixed(1)}, y:${h.y.toFixed(1)}`).join('\n'); }
    function pt(e){return e.touches?e.touches[0]:e;}
    function move(e){ if(drag===null)return; const r=rectOf(),p=pt(e);
      let x=Math.max(0,Math.min(100,(p.clientX-r.left)/r.width*100)), y=Math.max(0,Math.min(100,(p.clientY-r.top)/r.height*100));
      HOTSPOTS[drag].x=x;HOTSPOTS[drag].y=y;markers[drag].style.left=x+'%';markers[drag].style.top=y+'%';dump();e.preventDefault(); }
    markers.forEach((m,i)=>{ const s=(e)=>{ if(document.body.classList.contains('edit')){drag=i;e.preventDefault();e.stopPropagation();} };
      m.addEventListener('mousedown',s); m.addEventListener('touchstart',s,{passive:false}); });
    window.addEventListener('mousemove',move); window.addEventListener('touchmove',move,{passive:false});
    window.addEventListener('mouseup',()=>drag=null); window.addEventListener('touchend',()=>drag=null);
    document.getElementById('copyBtn').addEventListener('click',()=>{ out.select(); document.execCommand&&document.execCommand('copy'); navigator.clipboard&&navigator.clipboard.writeText(out.value); });
    dump();
  }
  function toggleEdit(){ document.body.classList.toggle('edit'); if(document.body.classList.contains('edit')){ closePopup(); initEdit(); } }
  if(location.search.includes('edit')||location.hash.includes('edit')) toggleEdit();
  document.getElementById('doneBtn').addEventListener('click',toggleEdit);
  window.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.shiftKey&&(e.key==='E'||e.key==='e')){ e.preventDefault(); toggleEdit(); } });

  updateProgress();
  </script>
</body>
</html>
